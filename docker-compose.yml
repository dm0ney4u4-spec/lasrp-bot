services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lasrp
      POSTGRES_USER: lasrp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_THIS_LOCAL_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["lasrp-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lasrp -d lasrp"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lasrp-postgres:
